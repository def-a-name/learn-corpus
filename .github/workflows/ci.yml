name: Test public code and example

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test functionality
        run: python -m pytest -q
      - name: Check public credential patterns
        run: python -m src.maintenance.scan_secrets
      - name: Run the public example
        run: python examples/run_example.py
