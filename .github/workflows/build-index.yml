name: Build pinned private retrieval index

on:
  workflow_call:
    inputs:
      repository:
        description: Expected private data repository owner/name
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: retrieval-index-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check caller and committed code
        env:
          EXPECTED_REPOSITORY: ${{ inputs.repository }}
        run: |
          python -c 'import os; from pathlib import Path; assert os.environ["GITHUB_REPOSITORY"] == os.environ["EXPECTED_REPOSITORY"], "Unexpected caller repository"; assert os.environ["GITHUB_REF"] == "refs/heads/main", "Release requires main"; assert Path("engine/requirements.txt").is_file(), "Pinned engine is missing"; assert Path("meta/manifest.json").is_file(), "Data manifest is missing"'
      - name: Install dependencies
        run: python -m pip install -r engine/requirements.txt
      - name: Test projection and release code
        working-directory: engine
        run: python -m pytest -q tests/test_project_items.py tests/test_build_lexical_index.py tests/test_maintenance.py tests/test_ingest_log.py tests/test_index_release.py tests/test_data_workspace.py
      - name: Validate private sources and build release
        working-directory: engine
        env:
          LEARN_CORPUS_DATA_ROOT: ${{ github.workspace }}
          EXPECTED_REPOSITORY: ${{ inputs.repository }}
          LEARN_CORPUS_BASE_COMMIT: ${{ github.event.before }}
        run: python -m src.maintenance.build_release --repository "$EXPECTED_REPOSITORY" --output "$RUNNER_TEMP/learn-corpus-release"
      - name: Upload verified private artifact
        uses: actions/upload-artifact@v7
        with:
          name: learn-corpus-index-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/learn-corpus-release/
          retention-days: 7
          if-no-files-found: error
